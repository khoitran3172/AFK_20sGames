<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#12202a" />
  <title>Chronicle of the Chieftain · AFK</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #12202a; overflow: hidden; overscroll-behavior: none; }
    /* position:fixed + dvh: trình duyệt nhúng (Facebook/Zalo...) đổi thanh công cụ liên tục nên không dùng 100vh thuần */
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #12202a; color: #ffe9a8; font: 600 20px/1.5 "Baloo 2", sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    #rotate .ph { width: 54px; height: 96px; border: 5px solid #ffe9a8; border-radius: 10px; margin-bottom: 22px; animation: rot 2.4s ease-in-out infinite; }
    @keyframes rot { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    /* điện thoại cầm dọc: game là màn ngang 16:9 nên yêu cầu xoay ngang */
    @media (orientation: portrait) and (max-width: 820px) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div class="ph"></div><div id="rotate-msg">Xoay ngang điện thoại để chơi nha</div></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    (function () {
      try { if (localStorage.getItem('afk_lang') === 'en') document.getElementById('rotate-msg').textContent = 'Rotate your phone to landscape to play'; } catch (e) {}
    })();
  </script>
</body>
</html>
