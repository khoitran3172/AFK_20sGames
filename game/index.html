<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thương Hội AFK</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="scene" width="960" height="540"></canvas>

  <!-- HUD trong game -->
  <div id="hud">
    <div id="guild"></div>
    <div class="res" id="res"></div>
    <div class="hbtn"><button class="ib" id="btnLogin" title="Điểm danh">📅</button><button class="ib" id="btnSet" title="Cài đặt">⚙</button><button class="ib" id="btnFs" title="Toàn màn hình">⛶</button></div>
  </div>
  <div id="golden"></div>
  <div id="hint"></div>

  <!-- cửa sổ nổi -->
  <div id="win" class="hidden">
    <div id="winTitle"></div>
    <button id="winClose" class="ib red" title="Đóng">✕</button>
    <div id="winBody"></div>
  </div>

  <!-- thanh menu dưới -->
  <div id="dock"></div>

  <div id="arena"></div>

  <div id="summon"></div>

  <div id="modal"><div class="inner" id="modalInner"></div></div>
  <div id="toast"></div>
</div>
<div id="credit">Tiny Swords © Pixel Frog · 32rogues © Seth Boyles · Super Pixel Effects Gigapack — Will Tice / unTied Games · Platformer Character Pack — Merakintsugi</div>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/game.js"></script>
<script src="js/battle.js"></script>
<script src="assets/fx/fx.js"></script>
<script src="js/fx.js"></script>
<script src="js/scene.js"></script>
<script src="js/summon.js"></script>
<script src="js/battleui.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
